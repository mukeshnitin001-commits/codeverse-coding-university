{% extends "base.html" %}
{% block title %}Log In{% endblock %}
{% block content %}
<div class="card" style="max-width:440px;margin:30px auto;">
  <h1>Welcome back</h1>
  <p class="muted">Log in to continue learning.</p>
  <form method="post" style="margin-top:16px;">
    <label>Username</label>
    <input type="text" name="username" required placeholder="your username">
    <label>Password</label>
    <input type="password" name="password" required placeholder="••••••••">
    <button class="btn" type="submit" style="width:100%;">Log In</button>
  </form>
  <p class="muted" style="margin-top:14px;text-align:center;">New here? <a href="{{ url_for('register') }}" style="color:#00cec9;">Create an account</a></p>
</div>
{% endblock %}
