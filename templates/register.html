{% extends "base.html" %}
{% block title %}Create Account{% endblock %}
{% block content %}
<div class="card" style="max-width:440px;margin:30px auto;">
  <h1>Create your account</h1>
  <p class="muted">Start your free coding journey.</p>
  <form method="post" style="margin-top:16px;">
    <label>Username</label>
    <input type="text" name="username" required placeholder="choose a username">
    <label>Password</label>
    <input type="password" name="password" required placeholder="create a password">
    <button class="btn" type="submit" style="width:100%;">Sign Up</button>
  </form>
  <p class="muted" style="margin-top:14px;text-align:center;">Already have an account? <a href="{{ url_for('login') }}" style="color:#00cec9;">Log in</a></p>
</div>
{% endblock %}
